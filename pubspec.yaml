dev_dependencies:
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon-apps.png"
  image_path_ios: "assets/images/icon-apps.png"
  remove_alpha_ios: true

